<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balap Kuis Trivia - Lilac Edition</title>
    <style>
        :root {
            --primary-lilac: #9b72cf;
            --light-lilac: #f3eefc;
            --card-lilac: #e2d7f5;
            --dark-lilac: #3c2a4d;
            --accent-purple: #7b42bc;
            --correct-green: #68d391;
            --wrong-red: #fc8181;
            --white: #ffffff;
            --shadow: 0 8px 25px rgba(60, 42, 77, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-lilac);
            color: var(--dark-lilac);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--dark-lilac);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--accent-purple);
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 2px solid var(--card-lilac);
        }

        /* Config Form */
        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--dark-lilac);
        }

        input[type="text"] {
            padding: 12px 15px;
            border: 2px solid var(--card-lilac);
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-purple);
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-lilac), var(--accent-purple));
            color: var(--white);
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 15px rgba(123, 66, 188, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* Arena Balap */
        .race-track-container {
            background: var(--light-lilac);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            border: 2px dashed var(--primary-lilac);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lane {
            display: flex;
            align-items: center;
            background: var(--white);
            border-radius: 30px;
            padding: 6px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .player-tag {
            width: 120px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-line {
            flex-grow: 1;
            height: 20px;
            background: var(--card-lilac);
            border-radius: 10px;
            margin: 0 10px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-lilac), var(--accent-purple));
            border-radius: 10px;
            transition: width 0.4s ease;
            position: relative;
        }

        .car-icon {
            font-size: 1.1rem;
            position: absolute;
            right: -8px;
            top: -2px;
        }

        /* Quiz Section */
        .quiz-section {
            background: var(--card-lilac);
            padding: 20px;
            border-radius: 15px;
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .turn-badge {
            background: var(--accent-purple);
            color: var(--white);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .q-count {
            font-weight: 600;
            color: var(--dark-lilac);
            font-size: 0.9rem;
        }

        .question-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .option-btn {
            background: var(--white);
            border: 2px solid var(--primary-lilac);
            color: var(--dark-lilac);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: var(--primary-lilac);
            color: var(--white);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(60, 42, 77, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-body {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow);
        }

        .modal-body h2 {
            color: var(--accent-purple);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎️ BALAP KUIS TRIVIA</h1>
        <p class="subtitle">Game Edukasi Multi-Player (6 Pemain)</p>
    </header>

    <div class="container">
        <!-- Pengaturan Game -->
        <div id="setup-screen" class="setup-screen">
            <div class="form-group">
                <label for="sheet-id">ID atau URL Google Spreadsheet:</label>
                <input type="text" id="sheet-id" placeholder="Contoh: 1BssaGcougen7R_fsOQeGC7RDhOhbzUDcBrdymigVoME">
            </div>

            <div class="form-group">
                <label>Nama Pemain (6 Players):</label>
                <div class="player-grid">
                    <input type="text" id="p1" value="Pemain 1" placeholder="Pemain 1">
                    <input type="text" id="p2" value="Pemain 2" placeholder="Pemain 2">
                    <input type="text" id="p3" value="Pemain 3" placeholder="Pemain 3">
                    <input type="text" id="p4" value="Pemain 4" placeholder="Pemain 4">
                    <input type="text" id="p5" value="Pemain 5" placeholder="Pemain 5">
                    <input type="text" id="p6" value="Pemain 6" placeholder="Pemain 6">
                </div>
            </div>

            <button class="btn" onclick="initGame()">Mulai Permainan</button>
        </div>

        <!-- Area Balap & Kuis -->
        <div id="game-screen" style="display: none;">
            <div class="race-track-container" id="tracks-area">
                <!-- Track 6 Player di-generate via JS -->
            </div>

            <div class="quiz-section" id="quiz-area">
                <div class="quiz-header">
                    <span class="turn-badge" id="turn-indicator">Giliran: Pemain 1</span>
                    <span class="q-count" id="q-count-indicator">Soal 1</span>
                </div>
                <div class="question-card" id="question-text">Memuat Pertanyaan...</div>
                <div class="options-grid" id="options-area">
                    <!-- Tombol Pilihan Jawaban -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pemenang -->
    <div class="modal" id="winner-modal">
        <div class="modal-body">
            <h2>🏆 Selamat!</h2>
            <p id="winner-name" style="font-size: 1.2rem; margin: 15px 0; font-weight: bold;"></p>
            <button class="btn" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIdx = 0;
        let activePlayerIdx = 0;
        let players = [];
        const TOTAL_PLAYERS = 6;
        const TARGET_SCORE = 100; // Capai 100% untuk garis finish

        // Deteksi parameter `?id=` di URL saat halaman pertama kali dibuka
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('id');
            if (idFromUrl) {
                document.getElementById('sheet-id').value = idFromUrl;
            } else {
                // Default ID jika tidak ada di URL
                document.getElementById('sheet-id').value = "1BssaGcougen7R_fsOQeGC7RDhOhbzUDcBrdymigVoME";
            }
        });

        // Ekstraksi ID Spreadsheet dari input/URL
        function parseSpreadsheetId(input) {
            const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : input.trim();
        }

        // Ambil CSV dari Spreadsheet Publik
        async function fetchQuestions(sheetId) {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                const text = await response.text();
                return parseCSV(text);
            } catch (err) {
                alert("Gagal membaca Spreadsheet! Pastikan link Spreadsheet disetel ke 'Siapa saja yang memiliki link' (Public).");
                return [];
            }
        }

        // Parser CSV yang handal untuk membaca semua baris soal tanpa batas
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const data = [];

            for (let line of lines) {
                if (!line.trim()) continue;
                
                // Regex parsing CSV untuk mengolah koma dalam petik
                const row = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                const cleanRow = row.map(cell => cell.replace(/^"(.*)"$/, '$1').trim());

                if (cleanRow.length >= 6) {
                    const question = cleanRow[0];
                    const opts = [cleanRow[1], cleanRow[2], cleanRow[3], cleanRow[4]];
                    const answerKey = cleanRow[5].toUpperCase();

                    let correctIdx = 0;
                    if (answerKey === 'B') correctIdx = 1;
                    if (answerKey === 'C') correctIdx = 2;
                    if (answerKey === 'D') correctIdx = 3;

                    data.push({
                        question: question,
                        options: opts,
                        answer: correctIdx
                    });
                }
            }
            return data;
        }

        async function initGame() {
            const rawId = document.getElementById('sheet-id').value;
            const sheetId = parseSpreadsheetId(rawId);

            if (!sheetId) {
                alert("Masukkan ID atau URL Spreadsheet yang valid!");
                return;
            }

            questions = await fetchQuestions(sheetId);

            if (questions.length === 0) {
                alert("Format Spreadsheet tidak valid atau soal kosong.");
                return;
            }

            // Inisialisasi Data 6 Pemain
            players = [];
            for (let i = 1; i <= TOTAL_PLAYERS; i++) {
                const name = document.getElementById(`p${i}`).value.trim() || `Pemain ${i}`;
                players.push({ name: name, score: 0 });
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('quiz-area').style.display = 'block';

            renderTracks();
            displayQuestion();
        }

        function renderTracks() {
            const container = document.getElementById('tracks-area');
            container.innerHTML = '';

            players.forEach((player, i) => {
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.innerHTML = `
                    <div class="player-tag">${player.name}</div>
                    <div class="track-line">
                        <div class="progress-bar" id="pb-${i}">
                            <span class="car-icon">🏎️</span>
                        </div>
                    </div>
                `;
                container.appendChild(lane);
            });
        }

        function displayQuestion() {
            if (questions.length === 0) return;

            // Mengulang soal secara melingkar (loop) jika jumlah soal terbatas
            const q = questions[currentQuestionIdx % questions.length];

            document.getElementById('turn-indicator').innerText = `🎯 Giliran: ${players[activePlayerIdx].name}`;
            document.getElementById('q-count-indicator').innerText = `Soal #${currentQuestionIdx + 1}`;
            document.getElementById('question-text').innerText = q.question;

            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = '';

            const labels = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${labels[idx]}. ${opt}`;
                btn.onclick = () => checkAnswer(idx === q.answer);
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                // Setiap jawaban benar menambah progres 20% (5 jawaban benar = finish)
                players[activePlayerIdx].score += 20;
                const currentScore = players[activePlayerIdx].score;

                document.getElementById(`pb-${activePlayerIdx}`).style.width = `${currentScore}%`;

                if (currentScore >= TARGET_SCORE) {
                    finishGame(players[activePlayerIdx].name);
                    return;
                }
            }

            // Rotasi giliran pemain & lanjut ke soal berikutnya
            activePlayerIdx = (activePlayerIdx + 1) % TOTAL_PLAYERS;
            currentQuestionIdx++;
            displayQuestion();
        }

        function finishGame(winnerName) {
            document.getElementById('winner-name').innerText = `${winnerName} Menang Dalam Balapan! 🎉`;
            document.getElementById('winner-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
